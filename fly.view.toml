# The hosted viewer. It holds a Viser scene and serves it to browsers; the browser renders.
app = "weft-view"
primary_region = "sjc"

[build]
  dockerfile = "deploy/Dockerfile.view"

[env]
  PLANE = "wss://weft-room.fly.dev"
  VISER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
