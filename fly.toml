# One room. It stops when empty and wakes when somebody is predicted to arrive, which is
# what makes the price. See docs/logbook/platform.md.
app = "weft-room"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  BODIES = "40"
  SPACING = "0.9"

[http_service]
  internal_port = 8770
  force_https = true
  auto_stop_machines = "stop"      # an empty room bills nothing
  auto_start_machines = true       # and wakes on the first arrival
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
